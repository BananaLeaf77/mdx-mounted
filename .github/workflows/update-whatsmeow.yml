name: Update whatsmeow dependency

on:
  repository_dispatch:
    types: [whatsmeow-updated]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MDX-Back
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Point replace ke fork (branch main)
        run: |
          go mod edit -replace go.mau.fi/whatsmeow=github.com/madeu2100-ctrl/whatsmeow@main
          go mod tidy

      - name: Build test
        run: go build ./...

      - name: Commit & push kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet go.mod go.sum; then
            git add go.mod go.sum
            git commit -m "chore: sync whatsmeow dari fork (auto)"
            git push
          else
            echo "Tidak ada perubahan, skip commit."
          fi